  <style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 500 800; font-display: swap; src: url(fonts/archivo-var.woff2) format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(fonts/dm-sans-var.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #fdfcf9; color: #123332; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { max-width: 560px; text-align: center; }
  .brand img { width: min(340px, 80vw); height: auto; }
  h1 { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); color: rgb(10,96,74); margin: 28px 0 14px; letter-spacing: -0.01em; }
  p { font-size: 1.125rem; line-height: 1.6; color: #33514d; }
  .actions { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  a.btn { display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 1.05rem; text-decoration: none; border-radius: 999px; padding: 14px 30px; }
  a.call { background: rgb(10,96,74); color: #fff; }
  a.mail { color: rgb(10,96,74); border: 2px solid rgb(10,96,74); background: transparent; }
  .slogan { margin-top: 34px; font-weight: 600; color: #b07d10; }

    <div class="actions">

      <a class="btn mail" href="mailto:hello@ringandrespond.com">hello@ringandrespond.com</a>
